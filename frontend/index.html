<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Test-Workbench</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- ==================== 顶栏 ==================== -->
    <header class="header">
        <div class="header-left">
            <div class="logo-wrapper">
                <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="10" fill="url(#logoGrad)"/>
                    <path d="M12 26L20 14L28 26H12Z" fill="white" opacity="0.9"/>
                    <circle cx="20" cy="20" r="2" fill="white" opacity="0.6"/>
                    <defs>
                        <linearGradient id="logoGrad" x1="0" y1="0" x2="40" y2="40">
                            <stop offset="0%" stop-color="#6366f1"/>
                            <stop offset="100%" stop-color="#8b5cf6"/>
                        </linearGradient>
                    </defs>
                </svg>
                <span class="app-name">AI-Test-Workbench</span>
            </div>
            <span class="app-badge">v1.0</span>
        </div>
        <div class="header-right">
            <div class="model-selector">
                <span class="model-label">模型</span>
                <span class="model-name" id="modelName">codellama-test:latest</span>
                <span class="model-status">
                    <span class="status-dot online"></span>
                </span>
            </div>
            <button class="btn-icon" id="clearBtn" title="清空对话">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"/>
                    <path d="M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2"/>
                    <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- ==================== 主内容区 ==================== -->
    <main class="main-content" id="mainContent">
        <!-- 消息将动态渲染到这里 -->
        <div class="messages-container" id="messagesContainer">
            <!-- 欢迎消息由 JavaScript 渲染 -->
        </div>

        <!-- 加载指示器 -->
        <div class="typing-indicator" id="typingIndicator" style="display: none;">
            <div class="message assistant">
                <div class="message-avatar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2a10 10 0 0110 10 10 10 0 01-10 10 10 10 0 01-10-10 10 10 0 0110-10z"/>
                        <path d="M12 6v6l4 2"/>
                    </svg>
                </div>
                <div class="message-bubble">
                    <span class="typing-dots">
                        <span></span><span></span><span></span>
                    </span>
                </div>
            </div>
        </div>

        <!-- 滚动到底部按钮 -->
        <button class="scroll-bottom-btn" id="scrollBottomBtn" style="display: none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M12 5v14M5 12l7 7 7-7"/>
            </svg>
        </button>
    </main>

    <!-- ==================== 底部输入区 ==================== -->
    <footer class="input-area">
        <div class="input-wrapper">
            <!-- 模板快捷按钮栏（新增） -->
            <div class="template-bar" id="templateBar">
                <!-- 模板按钮由 JavaScript 动态渲染 -->
            </div>
            <div class="input-container">
                <textarea
                    id="messageInput"
                    placeholder="输入您的问题..."
                    rows="1"
                ></textarea>
                <button class="btn-send" id="sendBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>
            <div class="input-hint">
                <span class="hint-text">↵ Enter 发送 · Shift+Enter 换行</span>
                <span class="session-info" id="sessionInfo">新会话</span>
            </div>
        </div>
    </footer>

    <!-- ==================== JavaScript ==================== -->
    <script src="/static/js/api.js"></script>
    <script src="/static/js/templates.js"></script>
    <script src="/static/js/chat.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
